<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Health Department Survey Management</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b0f19;
            --card-bg: rgba(30, 41, 59, 0.45);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary-accent: #3b82f6;
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.1) 0px, transparent 50%);
            overflow: hidden;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            padding: 3rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transform: translateY(0);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
        }

        .brand-logo {
            font-size: 3rem;
            background: linear-gradient(135deg, #60a5fa, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            display: inline-block;
        }

        .form-control-custom {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: #fff;
            padding: 0.75rem 1rem;
            transition: all 0.2s ease;
        }

        .form-control-custom:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: var(--primary-accent);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.25);
            color: #fff;
        }

        .btn-gradient {
            background: var(--primary-gradient);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 0.8rem;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s ease;
        }

        .btn-gradient:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <div class="brand-logo">
            <i class="fa-solid fa-heart-pulse"></i>
        </div>
        <h1 class="h3 mb-1 fw-bold text-white">Welcome Back</h1>
        <p class="text-secondary mb-4">Health Department Survey System</p>
        
        {% if error %}
            <div class="alert alert-danger border-0 rounded-3 text-start mb-4 bg-danger bg-opacity-25 text-white" role="alert">
                <i class="fa-solid fa-triangle-exclamation me-2"></i>{{ error }}
            </div>
        {% endif %}

        <form method="post" action="/login/" class="text-start">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label text-secondary fw-semibold">Username</label>
                <input type="text" class="form-control form-control-custom" id="username" name="username" required placeholder="Enter username">
            </div>
            <div class="mb-4">
                <label for="password" class="form-label text-secondary fw-semibold">Password</label>
                <input type="password" class="form-control form-control-custom" id="password" name="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-gradient mt-2">
                <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
            </button>
        </form>
    </div>

</body>
</html>
